<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>固定資産棚卸・存在確認アプリ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* QRコードスキャナーのスタイル微調整 */
    #reader {
      border: none !important;
    }
    #reader video {
      border-radius: 0.75rem;
      object-fit: cover;
    }
    #reader__scan_region {
      background: rgba(0, 0, 0, 0.02);
      border-radius: 0.75rem;
    }
    #reader__dashboard_section_csr button {
      background-color: #2563eb !important;
      color: white !important;
      border-radius: 0.5rem !important;
      padding: 0.5rem 1rem !important;
      font-weight: 600 !important;
      border: none !important;
      cursor: pointer !important;
      margin-top: 0.5rem !important;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- ヘッダー -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-boxes-packing text-xl"></i>
        <h1 class="font-bold text-lg leading-tight">固定資産 棚卸確認</h1>
      </div>
      <button id="sound-toggle" onclick="toggleSound()" class="px-3 py-1 bg-indigo-500 hover:bg-indigo-400 rounded-full text-xs font-medium flex items-center gap-1 transition">
        <i id="sound-icon" class="fa-solid fa-volume-high"></i>
        <span id="sound-text">Sound ON</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <main class="max-w-md mx-auto px-4 mt-4 flex flex-col gap-4">

    <!-- 拠点情報カード -->
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
      <div class="flex justify-between items-center">
        <div>
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Target Location</span>
          <span id="store-name" class="text-lg font-bold text-slate-800">拠点未指定（QR未読み込み）</span>
        </div>
        <div id="status-chip" class="px-2.5 py-1 bg-amber-100 text-amber-700 text-xs font-semibold rounded-full flex items-center gap-1">
          <i class="fa-solid fa-clock"></i> 待機中
        </div>
      </div>
    </div>

    <!-- カメラエリア -->
    <div class="bg-white rounded-xl p-3 shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-2 px-1">
        <span class="text-sm font-semibold text-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-camera text-indigo-500"></i> QRコードスキャナー
        </span>
        <span class="text-xs text-slate-400">枠内にQRを合わせてください</span>
      </div>
      <div id="reader" class="overflow-hidden rounded-lg bg-slate-50"></div>
    </div>

    <!-- 進捗サマリーバー -->
    <div id="progress-card" class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 hidden">
      <div class="flex justify-between items-center mb-2">
        <span class="text-sm font-semibold text-slate-700">消し込み進捗</span>
        <span id="progress-text" class="text-sm font-bold text-indigo-600">0 / 0 件 (0%)</span>
      </div>
      <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- 未確認リストカード -->
    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <h2 class="font-bold text-slate-800">未確認の固定資産</h2>
          <span id="count-badge" class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-0.5 rounded-full">0 件</span>
        </div>
        <button onclick="clearAllData()" class="text-xs text-slate-400 hover:text-rose-500 transition">
          <i class="fa-solid fa-rotate-left"></i> リセット
        </button>
      </div>

      <div id="result-container" class="max-h-60 overflow-y-auto space-y-2 pr-1">
        <div class="text-center py-8 text-slate-400 text-sm">
          <i class="fa-solid fa-qrcode text-3xl mb-2 text-slate-300 block"></i>
          まずは拠点の棚卸用QRコードを<br>スキャンしてください
        </div>
      </div>
    </div>

    <!-- 送信ボタンエリア -->
    <div class="pt-2">
      <button id="send-btn" onclick="move()" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-400 text-white font-bold py-3.5 px-4 rounded-xl shadow-md shadow-emerald-600/20 active:scale-[0.98] transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane" id="send-icon"></i>
        <span id="send-text">送信</span>
      </button>

    </div>

  </main>

  <script>
    // --- アプリケーション状態 ---
    let CURRENT_TEXT = '';
    let CURRENT_DATA = [];      // 未確認リスト
    let INITIAL_TOTAL_COUNT = 0; // 初期対象総数
    let CURRENT_STORE = '';
    let READ_FLAG = false;
    let RESULT_DATA = [];       // 送信用成果物データ
    let IS_SOUND_ENABLED = true;

    // --- 音声生成（Web Audio APIを使用） ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep() {
      if (!IS_SOUND_ENABLED) return;
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {
        console.log("Audio Error:", e);
      }
    }

    // サウンドON/OFF切替
    function toggleSound() {
      IS_SOUND_ENABLED = !IS_SOUND_ENABLED;
      const icon = document.getElementById('sound-icon');
      const text = document.getElementById('sound-text');
      const btn = document.getElementById('sound-toggle');

      if (IS_SOUND_ENABLED) {
        icon.className = 'fa-solid fa-volume-high';
        text.textContent = 'Sound ON';
        btn.className = 'px-3 py-1 bg-indigo-500 hover:bg-indigo-400 rounded-full text-xs font-medium flex items-center gap-1 transition';
        playBeep();
      } else {
        icon.className = 'fa-solid fa-volume-xmark';
        text.textContent = 'Mute';
        btn.className = 'px-3 py-1 bg-slate-500 hover:bg-slate-400 rounded-full text-xs font-medium flex items-center gap-1 transition';
      }
    }

    // 初回タップ時のAudioContextロック解除
    document.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }, { once: true });

    // バックグラウンドでのGoogleフォーム送信処理
    const move = async () => {
      if (RESULT_DATA.length === 0) {
        alert("送信するデータがありません。");
        return;
      }

      const sendBtn = document.getElementById('send-btn');
      const sendText = document.getElementById('send-text');
      const sendIcon = document.getElementById('send-icon');

      // 二重送信防止UI
      sendBtn.disabled = true;
      sendText.textContent = "送信中...";
      sendIcon.className = "fa-solid fa-spinner fa-spin";

      // Googleフォームの送信先URL（formResponse）
      const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSe2rPBnPxagwsUH67o8snQpanz0uCpl0qXjJjKNOu49xr3UEg/formResponse';
      
      // フォームデータを作成
      const formData = new FormData();
      formData.append('entry.212807671', RESULT_DATA.join(',')); // データ項目ID

      try {
        // 画面遷移せずに裏でPOST送信
        await fetch(FORM_URL, {
          method: 'POST',
          body: formData,
          mode: 'no-cors' // Googleフォームのクロスドメイン送信に必要な設定
        });

        // 成功メッセージを表示して画面を初期化
        alert("✅ データを送信しました！");
        location.reload(); // 次の棚卸しの用にページをリロード

      } catch (error) {
        alert("❌ 送信に失敗しました。通信環境を確認してください。");
        sendBtn.disabled = false;
        sendText.textContent = "送信（画面遷移なし）";
        sendIcon.className = "fa-solid fa-paper-plane";
      }
    };

    // スキャン成功時の処理
    const onScanSuccess = (decodedText) => {
      if (CURRENT_TEXT !== decodedText) {
        CURRENT_TEXT = decodedText;

        let data = decodedText.split('|');
        let first = data.shift().split(',');

        // 1個目の親QR (先頭5桁数字: 拠点コード)
        if (first[0].match(/^\d{5}$/)) {
          document.getElementById('store-name').innerText = first[1] || ('拠点コード: ' + first[0]);
          CURRENT_STORE = first[0];
          CURRENT_DATA = data.filter(item => item.trim() !== '');
          INITIAL_TOTAL_COUNT = CURRENT_DATA.length;
          RESULT_DATA = [first[0]];

          updateStatusChip('進行中', 'bg-blue-100 text-blue-700');
          updateUI();
          playBeep();
        } 
        // 2個目の親QR (分割結合データ)
        else if (first[0] == '2' && first[1] == CURRENT_STORE && !READ_FLAG) {
          const newData = data.filter(item => item.trim() !== '');
          CURRENT_DATA = CURRENT_DATA.concat(newData);
          INITIAL_TOTAL_COUNT += newData.length;
          READ_FLAG = true;

          updateUI();
          playBeep();
        } 
        // 子QR (固定資産シール: 先頭12桁)
        else if (first[0].match(/^\d{12}$/)) {
          let index = CURRENT_DATA.findIndex(item => item.split(',')[0] === first[0]);
          if (index >= 0) {
            // 消し込み処理
            RESULT_DATA.push(first[0]);
            CURRENT_DATA.splice(index, 1);

            updateUI();
            playBeep();

            // 全部消し込み完了時の演出
            if (CURRENT_DATA.length === 0 && INITIAL_TOTAL_COUNT > 0) {
              updateStatusChip('完了', 'bg-emerald-100 text-emerald-700');
            }
          }
        }

        // 短時間の重複判定をクリア
        setTimeout(() => { CURRENT_TEXT = ''; }, 1500);
      }
    };

    // 状態チップの書き換え
    function updateStatusChip(text, classes) {
      const chip = document.getElementById('status-chip');
      chip.className = `px-2.5 py-1 text-xs font-semibold rounded-full flex items-center gap-1 ${classes}`;
      chip.innerHTML = `<i class="fa-solid fa-check"></i> ${text}`;
    }

    // UI表示の全体更新
    function updateUI() {
      const container = document.getElementById('result-container');
      const badge = document.getElementById('count-badge');
      const progressCard = document.getElementById('progress-card');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');

      badge.textContent = `${CURRENT_DATA.length} 件`;

      // 進捗バーの更新
      if (INITIAL_TOTAL_COUNT > 0) {
        progressCard.classList.remove('hidden');
        const doneCount = INITIAL_TOTAL_COUNT - CURRENT_DATA.length;
        const percent = Math.round((doneCount / INITIAL_TOTAL_COUNT) * 100);
        progressBar.style.width = `${percent}%`;
        progressText.textContent = `${doneCount} / ${INITIAL_TOTAL_COUNT} 件 (${percent}%)`;
      }

      // 未確認リスト描画
      if (CURRENT_DATA.length === 0) {
        if (INITIAL_TOTAL_COUNT > 0) {
          container.innerHTML = `
            <div class="text-center py-6 text-emerald-600 bg-emerald-50 rounded-lg border border-emerald-200">
              <i class="fa-solid fa-circle-check text-4xl mb-2 block"></i>
              <p class="font-bold">すべての固定資産が確認されました！</p>
              <p class="text-xs text-emerald-500 mt-1">「送信（画面遷移なし）」を押してください</p>
            </div>`;
        } else {
          container.innerHTML = `
            <div class="text-center py-8 text-slate-400 text-sm">
              <i class="fa-solid fa-qrcode text-3xl mb-2 text-slate-300 block"></i>
              まずは拠点の棚卸用QRコードを<br>スキャンしてください
            </div>`;
        }
        return;
      }

      container.innerHTML = CURRENT_DATA.map(item => {
        const parts = item.split(',');
        const code = parts[0] || item;
        const name = parts[1] || '名称未設定';
        return `
          <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-sm">
            <div>
              <span class="font-mono font-semibold text-indigo-600 block text-xs">${code}</span>
              <span class="text-slate-700 text-xs font-medium">${name}</span>
            </div>
            <span class="text-xs bg-amber-50 text-amber-600 px-2 py-1 rounded border border-amber-200 font-medium">未確認</span>
          </div>`;
      }).join('');
    }

    // 全データクリア
    function clearAllData() {
      if (confirm("データをリセットしますか？")) {
        CURRENT_TEXT = '';
        CURRENT_DATA = [];
        INITIAL_TOTAL_COUNT = 0;
        CURRENT_STORE = '';
        READ_FLAG = false;
        RESULT_DATA = [];
        document.getElementById('store-name').innerText = '拠点未指定（QR未読み込み）';
        document.getElementById('progress-card').classList.add('hidden');
        updateStatusChip('待機中', 'bg-amber-100 text-amber-700');
        updateUI();
      }
    }

    // スキャナー起動
    window.addEventListener('load', () => {
      const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 10, 
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      });
      html5QrcodeScanner.render(onScanSuccess);
    });
  </script>
</body>
</html>
